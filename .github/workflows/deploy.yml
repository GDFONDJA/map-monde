name: Publier Map Monde

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v6

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Installer les dependances
        run: npm ci
        working-directory: frontend

      - name: Compiler le jeu
        run: npm run build
        working-directory: frontend

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparer le site
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4